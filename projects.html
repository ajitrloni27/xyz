<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>
  <meta name="description"
    content="Explore selected projects spanning apps, hackathon builds, and college works by Ajit Ramachandra Loni, 3rd year Information Science & Engineering student." />
  <meta name="theme-color" content="#0f0e0d" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Google Fonts: Syne, Space Grotesk, Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- BACKGROUND ANIMATION LAYER -->
  <div class="bg-layer" aria-hidden="true">
    <canvas id="bg-canvas" class="bg-canvas-elem"></canvas>
    <div class="bg-glow-orb bg-glow-orb-1"></div>
    <div class="bg-glow-orb bg-glow-orb-2"></div>
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
  </div>

  <!-- Soft Accent Glow Follower (Desktop) -->
  <div id="mouse-glow" class="mouse-glow" aria-hidden="true"></div>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand" aria-label="Ajit Home">
        <span class="brand-name">Ajit.-</span>
      </a>
      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="projects.html" class="nav-link active">Projects</a></li>
          <li><a href="tools.html" class="nav-link">Tools</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container">
    <!-- PROJECTS HEADER -->
    <section class="projects-header reveal">
      <span class="mono-label">[]</span>
      <h1 class="projects-title">My Projects</h1>
      <p class="projects-subtitle">
        Selected works spanning apps, hackathon builds, and college projects.
      </p>
    </section>

    <!-- SECTION 1: APPS -->
    <section class="reveal">
      <div class="category-header">
        <div class="category-title-wrap">
          <span class="category-number">[01]</span>
          <h2 class="category-name">Apps</h2>
        </div>
        <div class="category-line" aria-hidden="true"></div>
      </div>
      <div id="apps-grid" class="projects-grid"></div>
    </section>

    <!-- SECTION 2: HACKATHON PROJECTS -->
    <section class="reveal">
      <div class="category-header">
        <div class="category-title-wrap">
          <span class="category-number">[02]</span>
          <h2 class="category-name">Hackathon Projects</h2>
        </div>
        <div class="category-line" aria-hidden="true"></div>
      </div>
      <div id="hackathon-grid" class="projects-grid"></div>
    </section>

    <!-- SECTION 3: COLLEGE PROJECTS -->
    <section class="reveal">
      <div class="category-header">
        <div class="category-title-wrap">
          <span class="category-number">[03]</span>
          <h2 class="category-name">College Projects</h2>
        </div>
        <div class="category-line" aria-hidden="true"></div>
      </div>
      <div id="college-grid" class="projects-grid" style="margin-bottom: 5rem;"></div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="script.js"></script>
  <script src="projects.js"></script>
</body>

</html>
